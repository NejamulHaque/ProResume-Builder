<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Subtle border -->
  <rect width="512" height="512" rx="112" fill="none"
        stroke="rgba(255,255,255,0.10)" stroke-width="2"/>

  <!-- Document body -->
  <rect x="112" y="80" width="288" height="360" rx="22"
        fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Dog-ear fold -->
  <path d="M320 80 L400 160 L320 160 Z" fill="rgba(255,255,255,0.12)"/>
  <path d="M320 80 L400 160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Gradient title bar -->
  <rect x="132" y="100" width="140" height="20" rx="10" fill="url(#acc)" opacity="0.95"/>

  <!-- Separator dot -->
  <circle cx="278" cy="110" r="4" fill="url(#acc)" opacity="0.6"/>

  <!-- Name lines (wide = name) -->
  <rect x="132" y="142" width="200" height="10" rx="5" fill="rgba(255,255,255,0.45)"/>
  <rect x="132" y="160" width="160" height="10" rx="5" fill="rgba(255,255,255,0.28)"/>
  <rect x="132" y="178" width="180" height="10" rx="5" fill="rgba(255,255,255,0.28)"/>

  <!-- Section divider -->
  <line x1="132" y1="206" x2="368" y2="206"
        stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Section 2 -->
  <rect x="132" y="218" width="100" height="9"  rx="4.5" fill="url(#acc)" opacity="0.75"/>
  <rect x="132" y="236" width="200" height="8"  rx="4"   fill="rgba(255,255,255,0.35)"/>
  <rect x="132" y="252" width="170" height="8"  rx="4"   fill="rgba(255,255,255,0.22)"/>
  <rect x="132" y="268" width="190" height="8"  rx="4"   fill="rgba(255,255,255,0.22)"/>
  <rect x="132" y="284" width="150" height="8"  rx="4"   fill="rgba(255,255,255,0.18)"/>

  <!-- Section divider 2 -->
  <line x1="132" y1="308" x2="368" y2="308"
        stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Section 3 -->
  <rect x="132" y="320" width="90"  height="9"  rx="4.5" fill="url(#acc)" opacity="0.75"/>
  <rect x="132" y="338" width="200" height="8"  rx="4"   fill="rgba(255,255,255,0.30)"/>
  <rect x="132" y="354" width="175" height="8"  rx="4"   fill="rgba(255,255,255,0.20)"/>
  <rect x="132" y="370" width="185" height="8"  rx="4"   fill="rgba(255,255,255,0.20)"/>
  <rect x="132" y="386" width="155" height="8"  rx="4"   fill="rgba(255,255,255,0.16)"/>

  <!-- Bottom accent bar -->
  <rect x="112" y="416" width="288" height="3" rx="1.5" fill="url(#acc)" opacity="0.5"/>
</svg>
